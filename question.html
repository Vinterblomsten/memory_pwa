<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbles Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <div class="question">
            <h2 id="questionText">What is the capital of Denmark?</h2>
            <img id="questionImage" src="" alt="Denmark flag" class="question-image">
        </div>
        <div id="choicesGrid"></div>
    </div>
    <button class="btn" id="continueBtn", onclick="nextQuestion()">Continue</button>
    <button class="btn" id="returnBtn", onclick="returnToMenu()">Continue</button>
    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
