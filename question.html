<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbles Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <div class="question">
            <h2 id="questionsText">What is the capital of Denmark?</h2>
            <img id="questionImage" src="https://via.placeholder.com/300x200" alt="Denmark flag" class="question-image">
        </div>

        <div id="choices-grid">
        </div>
    </div>
    <button class="btn" id="continueBtn" hidden, onclick="nextQuestion()">Continue</button>
    <script src="app.js"></script>
</body>
</html>
